name: Release

# Build on every push and pull request (sdist + wheel, metadata checked) so packaging breaks show up early.
# Publish to PyPI only when a version tag (v*) is pushed, through PyPI trusted publishing (OIDC): no token is
# stored in GitHub. One-time setup on PyPI: project pinka -> Publishing -> add a GitHub publisher with
# owner Gaochengzhi, repository pinka, workflow release.yml, environment pypi.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Absolute links in the PyPI description (the repo README keeps relative ones)
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          sed -i -E "s#src=\"docs/#src=\"$raw/docs/#g; s#\]\((AGENTS\.md|LICENSE)\)#]($blob/\1)#g; s#href=\"(LICENSE|pyproject\.toml)\"#href=\"$blob/\1\"#g" README.md
          ! grep -nE 'src="docs/|\]\((AGENTS\.md|LICENSE)\)' README.md
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/pinka --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pinka/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
