[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pinka"
version = "0.2.1"
description = "Pack GPU jobs onto shared cards by measured memory: a single-node job pool with VRAM/CPU/RAM booking, dependencies and retries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Gao Chengzhi" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/Gaochengzhi/pinka"
Repository = "https://github.com/Gaochengzhi/pinka"
Issues = "https://github.com/Gaochengzhi/pinka/issues"

[project.optional-dependencies]
nvml = ["nvidia-ml-py"]
test = ["pytest"]

[project.scripts]
pinka = "pinka.cli:main"

[tool.setuptools]
packages = ["pinka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
